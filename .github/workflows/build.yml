name: Build APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build APK with Buildozer
        uses: digreatb2/android-buildozer-action@v2
        with:
          python-version: 3.10
          buildozer-cmd: buildozer android debug
